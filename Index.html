<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>가는 김에</title>

  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""/>

  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --ink:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#111827;
      --accent-soft:#eef2ff;
      --success:#027a48;
      --warning:#b54708;
      --danger:#b42318;
      --shadow:0 12px 35px rgba(16,24,40,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
      background:var(--bg);
      color:var(--ink);
    }
    .app{
      max-width:680px;
      margin:0 auto;
      min-height:100vh;
      padding-bottom:90px;
    }
    header{
      padding:22px 18px 12px;
      position:sticky;
      top:0;
      z-index:20;
      background:linear-gradient(to bottom, rgba(244,247,251,.98), rgba(244,247,251,.88), rgba(244,247,251,0));
      backdrop-filter:blur(8px);
    }
    h1{
      margin:0;
      font-size:28px;
      letter-spacing:-.6px;
    }
    .subtitle{
      margin-top:4px;
      color:var(--muted);
      font-size:14px;
    }
    .status{
      margin:10px 18px 0;
      padding:12px 14px;
      border-radius:16px;
      background:var(--card);
      box-shadow:var(--shadow);
      font-size:14px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
    }
    .status strong{font-size:14px}
    .status small{color:var(--muted)}
    .main{
      padding:14px 18px;
    }
    #map{
      height:42vh;
      min-height:320px;
      border-radius:24px;
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid rgba(16,24,40,.06);
      background:#dfe7ef;
    }
    .toolbar{
      display:flex;
      gap:10px;
      margin:12px 0 18px;
    }
    button{
      border:none;
      border-radius:15px;
      padding:12px 14px;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      transition:.18s ease;
    }
    button:active{transform:scale(.98)}
    .primary{
      background:var(--accent);
      color:white;
      flex:1;
    }
    .secondary{
      background:white;
      color:var(--ink);
      border:1px solid var(--line);
      flex:1;
    }
    .panel{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      margin-top:16px;
    }
    .panel h2{
      margin:0 0 12px;
      font-size:19px;
      letter-spacing:-.3px;
    }
    .field{
      margin-top:12px;
    }
    label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:#344054;
      margin-bottom:7px;
    }
    input, select{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:13px 14px;
      font-size:15px;
      background:white;
      outline:none;
    }
    input:focus, select:focus{
      border-color:#98a2b3;
      box-shadow:0 0 0 3px rgba(152,162,179,.13);
    }
    .hint{
      color:var(--muted);
      font-size:12px;
      margin-top:7px;
      line-height:1.45;
    }
    .selected-place{
      margin-top:10px;
      padding:11px 12px;
      background:#f8fafc;
      border-radius:13px;
      border:1px dashed #cbd5e1;
      font-size:13px;
    }
    .task-list{
      display:grid;
      gap:12px;
    }
    .task-card{
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      background:#fff;
    }
    .task-card.near{
      border-color:#a6f4c5;
      background:#f6fef9;
    }
    .task-card.done{
      opacity:.62;
    }
    .task-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .task-title{
      font-size:16px;
      font-weight:800;
      margin-bottom:5px;
    }
    .task-meta{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      background:#f2f4f7;
      color:#344054;
    }
    .badge.near{
      background:#dcfae6;
      color:var(--success);
    }
    .task-actions{
      display:flex;
      gap:8px;
      margin-top:12px;
    }
    .task-actions button{
      padding:9px 10px;
      font-size:12px;
      background:#f2f4f7;
      color:#344054;
      flex:1;
    }
    .task-actions .danger{
      color:var(--danger);
      background:#fff1f0;
    }
    .empty{
      color:var(--muted);
      font-size:14px;
      text-align:center;
      padding:24px 8px 8px;
    }
    .recommend{
      border-radius:18px;
      background:#101828;
      color:white;
      padding:16px;
      margin-top:12px;
    }
    .recommend strong{
      display:block;
      font-size:16px;
      margin-bottom:6px;
    }
    .recommend small{
      color:#d0d5dd;
      line-height:1.5;
    }
    .footer-note{
      text-align:center;
      color:var(--muted);
      font-size:11px;
      padding:18px 22px;
      line-height:1.5;
    }
    .leaflet-control-attribution{
      font-size:9px;
    }
    @media (max-width:420px){
      h1{font-size:25px}
      #map{height:38vh;min-height:290px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>가는 김에</h1>
    <div class="subtitle">내 위치 근처에서 지금 처리할 수 있는 일을 찾아드려요.</div>
  </header>

  <div class="status">
    <div>
      <strong id="locationStatus">위치 확인 전</strong><br>
      <small id="coordsText">GPS 권한이 필요합니다.</small>
    </div>
    <span id="gpsDot">📍</span>
  </div>

  <main class="main">
    <div id="map"></div>

    <div class="toolbar">
      <button class="secondary" id="locateBtn">내 위치로 이동</button>
      <button class="secondary" id="pickBtn">지도에서 장소 찍기</button>
    </div>

    <section class="panel" id="recommendPanel">
      <h2>지금 가는 김에</h2>
      <div id="recommendContent" class="empty">GPS 위치를 잡으면 가까운 할 일을 추천합니다.</div>
    </section>

    <section class="panel">
      <h2>할 일 추가</h2>
      <div class="field">
        <label for="taskTitle">무엇을 해야 하나요?</label>
        <input id="taskTitle" placeholder="예: 다이소에서 건전지 사기">
      </div>

      <div class="field">
        <label for="placeName">장소 이름</label>
        <input id="placeName" placeholder="예: 다이소 서울대입구점">
      </div>

      <div class="field">
        <label for="radius">얼마나 가까우면 알려드릴까요?</label>
        <select id="radius">
          <option value="100">100m</option>
          <option value="300" selected>300m</option>
          <option value="500">500m</option>
          <option value="1000">1km</option>
        </select>
      </div>

      <div id="selectedPlace" class="selected-place">아직 장소를 지정하지 않았습니다. 지도에서 원하는 위치를 눌러주세요.</div>

      <div class="toolbar" style="margin-bottom:0">
        <button class="primary" id="saveTaskBtn">이 할 일 저장</button>
      </div>
      <div class="hint">장소 선택 모드에서는 지도를 한 번 누르면 해당 위치가 저장됩니다.</div>
    </section>

    <section class="panel">
      <h2>등록한 할 일</h2>
      <div id="taskList" class="task-list"></div>
    </section>

    <div class="footer-note">
      데이터는 이 브라우저의 로컬 저장소에만 저장됩니다.<br>
      GPS는 브라우저 권한이 허용된 경우에만 작동합니다.
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin=""></script>
<script>
  const STORAGE_KEY = "ganeun-gime-tasks-v1";

  const map = L.map("map", { zoomControl: true }).setView([37.5665, 126.9780], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  let userLatLng = null;
  let userMarker = null;
  let userAccuracyCircle = null;
  let pickedLatLng = null;
  let pickedMarker = null;
  let pickMode = false;
  let taskMarkers = [];
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  const locationStatus = document.getElementById("locationStatus");
  const coordsText = document.getElementById("coordsText");
  const selectedPlace = document.getElementById("selectedPlace");
  const taskList = document.getElementById("taskList");
  const recommendContent = document.getElementById("recommendContent");
  const taskTitle = document.getElementById("taskTitle");
  const placeName = document.getElementById("placeName");
  const radius = document.getElementById("radius");

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function formatDistance(m) {
    if (m < 1000) return `${Math.round(m)}m`;
    return `${(m / 1000).toFixed(1)}km`;
  }

  function distanceMeters(a, b) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);
    const x = Math.sin(dLat/2) ** 2 +
      Math.sin(dLon/2) ** 2 * Math.cos(lat1) * Math.cos(lat2);
    return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }

  function updateUserPosition(lat, lng, accuracy) {
    userLatLng = { lat, lng };

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map).bindPopup("현재 위치");
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    if (userAccuracyCircle) {
      userAccuracyCircle.setLatLng([lat, lng]).setRadius(accuracy || 20);
    } else {
      userAccuracyCircle = L.circle([lat, lng], {
        radius: accuracy || 20,
        weight: 1,
        opacity: .35,
        fillOpacity: .08
      }).addTo(map);
    }

    locationStatus.textContent = "현재 위치 확인됨";
    coordsText.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)} · 오차 약 ${Math.round(accuracy || 0)}m`;
    renderTasks();
    renderRecommendation();
  }

  function locate() {
    if (!navigator.geolocation) {
      locationStatus.textContent = "이 브라우저는 GPS를 지원하지 않습니다.";
      return;
    }

    locationStatus.textContent = "현재 위치 확인 중...";
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude, accuracy } = pos.coords;
        updateUserPosition(latitude, longitude, accuracy);
        map.setView([latitude, longitude], 16);
      },
      err => {
        locationStatus.textContent = "위치를 가져오지 못했습니다.";
        coordsText.textContent = err.message || "위치 권한을 확인해주세요.";
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 5000 }
    );
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      pos => updateUserPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
      () => {},
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
  }

  document.getElementById("locateBtn").addEventListener("click", () => {
    if (userLatLng) {
      map.setView([userLatLng.lat, userLatLng.lng], 16);
    } else {
      locate();
    }
  });

  document.getElementById("pickBtn").addEventListener("click", (e) => {
    pickMode = !pickMode;
    e.currentTarget.textContent = pickMode ? "장소 선택 중..." : "지도에서 장소 찍기";
    e.currentTarget.style.background = pickMode ? "#111827" : "";
    e.currentTarget.style.color = pickMode ? "#fff" : "";
  });

  map.on("click", e => {
    if (!pickMode) return;
    pickedLatLng = { lat: e.latlng.lat, lng: e.latlng.lng };

    if (pickedMarker) map.removeLayer(pickedMarker);
    pickedMarker = L.marker(e.latlng).addTo(map).bindPopup("선택한 장소").openPopup();

    selectedPlace.textContent = `선택된 위치: ${pickedLatLng.lat.toFixed(5)}, ${pickedLatLng.lng.toFixed(5)}`;
    pickMode = false;

    const btn = document.getElementById("pickBtn");
    btn.textContent = "지도에서 장소 찍기";
    btn.style.background = "";
    btn.style.color = "";
  });

  document.getElementById("saveTaskBtn").addEventListener("click", () => {
    const title = taskTitle.value.trim();
    const place = placeName.value.trim();

    if (!title) {
      alert("할 일을 입력해주세요.");
      return;
    }
    if (!pickedLatLng) {
      alert("지도에서 장소를 먼저 지정해주세요.");
      return;
    }

    tasks.unshift({
      id: Date.now(),
      title,
      place: place || "지정한 장소",
      lat: pickedLatLng.lat,
      lng: pickedLatLng.lng,
      radius: Number(radius.value),
      done: false,
      createdAt: new Date().toISOString()
    });

    saveTasks();

    taskTitle.value = "";
    placeName.value = "";
    pickedLatLng = null;
    selectedPlace.textContent = "아직 장소를 지정하지 않았습니다. 지도에서 원하는 위치를 눌러주세요.";

    if (pickedMarker) {
      map.removeLayer(pickedMarker);
      pickedMarker = null;
    }

    renderTasks();
    renderRecommendation();
  });

  function renderTaskMarkers() {
    taskMarkers.forEach(m => map.removeLayer(m));
    taskMarkers = [];

    tasks.filter(t => !t.done).forEach(t => {
      const m = L.marker([t.lat, t.lng]).addTo(map);
      m.bindPopup(`<strong>${escapeHtml(t.title)}</strong><br>${escapeHtml(t.place)}`);
      taskMarkers.push(m);
    });
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderTasks() {
    renderTaskMarkers();

    if (tasks.length === 0) {
      taskList.innerHTML = `<div class="empty">아직 등록한 할 일이 없습니다.</div>`;
      return;
    }

    const withDistance = tasks.map(t => ({
      ...t,
      distance: userLatLng ? distanceMeters(userLatLng, {lat:t.lat, lng:t.lng}) : null
    }));

    withDistance.sort((a,b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.distance == null || b.distance == null) return b.createdAt.localeCompare(a.createdAt);
      return a.distance - b.distance;
    });

    taskList.innerHTML = withDistance.map(t => {
      const near = t.distance != null && t.distance <= t.radius && !t.done;
      return `
        <div class="task-card ${near ? "near" : ""} ${t.done ? "done" : ""}">
          <div class="task-top">
            <div>
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="task-meta">
                ${escapeHtml(t.place)}<br>
                ${t.distance == null ? "현재 위치 확인 전" : `현재 위치에서 ${formatDistance(t.distance)}`}
              </div>
            </div>
            <span class="badge ${near ? "near" : ""}">
              ${t.done ? "완료" : near ? "지금 가능" : `${t.radius}m 알림`}
            </span>
          </div>

          <div class="task-actions">
            <button onclick="focusTask(${t.id})">지도에서 보기</button>
            <button onclick="toggleDone(${t.id})">${t.done ? "다시 열기" : "완료"}</button>
            <button class="danger" onclick="deleteTask(${t.id})">삭제</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderRecommendation() {
    const active = tasks.filter(t => !t.done);

    if (!userLatLng) {
      recommendContent.className = "empty";
      recommendContent.textContent = "GPS 위치를 잡으면 가까운 할 일을 추천합니다.";
      return;
    }

    if (active.length === 0) {
      recommendContent.className = "empty";
      recommendContent.textContent = "진행 중인 할 일이 없습니다.";
      return;
    }

    const ranked = active.map(t => ({
      ...t,
      distance: distanceMeters(userLatLng, {lat:t.lat, lng:t.lng})
    })).sort((a,b) => a.distance - b.distance);

    const near = ranked.filter(t => t.distance <= t.radius);
    const best = near[0] || ranked[0];

    recommendContent.className = "recommend";
    if (near.length > 0) {
      recommendContent.innerHTML = `
        <strong>지금 처리하기 좋아요: ${escapeHtml(best.title)}</strong>
        <small>${escapeHtml(best.place)} · ${formatDistance(best.distance)} 거리<br>
        설정한 알림 반경 ${best.radius}m 안에 들어왔습니다.</small>
      `;
    } else {
      recommendContent.innerHTML = `
        <strong>가장 가까운 할 일: ${escapeHtml(best.title)}</strong>
        <small>${escapeHtml(best.place)}까지 약 ${formatDistance(best.distance)} 남았습니다.<br>
        ${best.radius}m 이내로 들어오면 “지금 가능”으로 표시됩니다.</small>
      `;
    }
  }

  window.focusTask = id => {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    map.setView([t.lat, t.lng], 17);
  };

  window.toggleDone = id => {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    saveTasks();
    renderTasks();
    renderRecommendation();
  };

  window.deleteTask = id => {
    if (!confirm("이 할 일을 삭제할까요?")) return;
    tasks = tasks.filter(x => x.id !== id);
    saveTasks();
    renderTasks();
    renderRecommendation();
  };

  renderTasks();
  renderRecommendation();
  setTimeout(locate, 500);
</script>
</body>
</html>
